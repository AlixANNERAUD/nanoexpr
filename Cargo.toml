[package]
name = "nanoexpr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast no_std math expression parser and evaluator with zero heap allocation: formulas with variables and functions for microcontrollers, WebAssembly and C, in f32, f64, integers or calculator-exact decimals"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
license = "MIT"
repository = "https://github.com/AlixANNERAUD/nanoexpr"
homepage = "https://github.com/AlixANNERAUD/nanoexpr"
documentation = "https://docs.rs/nanoexpr"
readme = "README.md"
keywords = ["math", "expression", "calculator", "no-std", "embedded"]
categories = ["embedded", "no-std", "no-std::no-alloc", "mathematics", "parser-implementations"]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
default = ["libm"]
libm = ["dep:libm"]
decimal = ["fraction"]
fraction = []
exact = ["decimal", "fraction"]

[dependencies]
libm = { version = "0.2", optional = true }

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "ffi"]
exclude = ["comparison"]
