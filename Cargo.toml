[package]
name = "nanoexpr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Tiny no_std math expression evaluator for embedded: zero heap allocation, single pass, pluggable number types, variables and functions"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
license = "MIT"
repository = "https://github.com/AlixANNERAUD/nanoexpr"
homepage = "https://github.com/AlixANNERAUD/nanoexpr"
documentation = "https://docs.rs/nanoexpr"
readme = "README.md"
keywords = ["expression", "evaluator", "calculator", "no-std", "embedded"]
categories = ["embedded", "no-std", "no-std::no-alloc", "mathematics", "parser-implementations"]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
default = ["libm"]
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2", optional = true }
