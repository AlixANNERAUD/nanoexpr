version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz", "/comparison"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
