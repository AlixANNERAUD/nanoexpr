name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy without libm
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test all features
        run: cargo test --all-features

      - name: Test without libm
        run: cargo test --no-default-features --lib --tests

      - name: Test stack use with optimizations
        run: cargo test --release --all-features --test stack

  embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi
          - thumbv7em-none-eabihf
          - riscv32imc-unknown-none-elf
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: ${{ matrix.target }}

      - name: Build
        run: cargo build --target ${{ matrix.target }}

      - name: Build with decimals
        run: cargo build --target ${{ matrix.target }} --features decimal

      - name: Build with exact results
        run: cargo build --target ${{ matrix.target }} --no-default-features --features exact

      - name: Build with fractions only
        run: cargo build --target ${{ matrix.target }} --no-default-features --features fraction

      - name: Build without libm
        run: cargo build --target ${{ matrix.target }} --no-default-features

      - name: Build the C library without std
        run: cargo rustc -p nanoexpr-ffi --target ${{ matrix.target }} --no-default-features --crate-type staticlib

  c:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: c-${{ matrix.compiler }}
          github-cache-mode: objects

      - name: Configure
        run: cmake -S ffi -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  msrv:
    runs-on: ubuntu-latest
    env:
      MISE_ENV: msrv
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: msrv

      - name: Test
        run: cargo test --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: jdx/mr-boxington-action@v1
        with:
          cache-key-suffix: package

      - name: Package
        run: cargo package
